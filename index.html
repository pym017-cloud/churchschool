<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>순천침례교회 교육부</title>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-database-compat.js"></script>

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; background: #f8f6f2; }
button { font-family: inherit; cursor: pointer; }
input, textarea { font-family: inherit; }

/* ── 부서 색상 ── */
:root {
  --el-color: #1D9E75;
  --el-light: #E1F5EE;
  --yo-color: #534AB7;
  --yo-light: #EEEDFE;
}

/* ── 공통 레이아웃 ── */
#app { max-width: 480px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; }

/* ── 로그인 ── */
#login-screen { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; }
.login-box { width: 100%; max-width: 360px; background: #fff; border-radius: 16px; padding: 24px; box-shadow: 0 2px 16px rgba(0,0,0,0.08); }
.teacher-btn { width: 100%; padding: 13px 16px; border-radius: 10px; border: 1.5px solid #eee; background: #fafafa; text-align: left; font-size: 14px; font-weight: 500; color: #333; margin-bottom: 8px; transition: all 0.15s; }
.teacher-btn.selected { border-color: var(--el-color); background: var(--el-light); color: var(--el-color); }
.login-btn { width: 100%; padding: 14px; border-radius: 10px; border: none; background: #ddd; color: #fff; font-size: 15px; font-weight: 600; }
.login-btn.active { background: var(--el-color); cursor: pointer; }

/* ── 헤더 ── */
#header { color: #fff; padding: 14px 20px 0; position: sticky; top: 0; z-index: 10; }
.dept-tabs { display: flex; gap: 4px; margin-top: 12px; }
.dept-tab { padding: 8px 16px; border-radius: 8px 8px 0 0; border: none; font-size: 13px; font-weight: 600; color: #fff; background: rgba(255,255,255,0.2); transition: all 0.15s; }
.dept-tab.active { background: #fff; }

/* ── 기능 탭 ── */
#func-tabs { display: flex; background: #fff; border-bottom: 1px solid #eee; position: sticky; z-index: 9; }
.func-tab { flex: 1; padding: 12px 4px 10px; background: none; border: none; border-bottom: 2.5px solid transparent; }
.func-tab .icon { font-size: 18px; margin-bottom: 2px; }
.func-tab .label { font-size: 11px; font-weight: 400; color: #aaa; }
.func-tab.active { }
.func-tab.active .label { font-weight: 600; }

/* ── 콘텐츠 ── */
#content { flex: 1; overflow-y: auto; }
.tab-panel { display: none; padding: 16px; }
.tab-panel.active { display: block; }

/* ── 카드/버튼 공통 ── */
.card { background: #fff; border-radius: 12px; border: 1px solid #eee; padding: 14px 16px; margin-bottom: 8px; }
.row-btn { display: flex; align-items: center; gap: 12px; width: 100%; padding: 12px 14px; background: #fff; border-radius: 10px; border: 1px solid #eee; text-align: left; margin-bottom: 6px; }
.avatar { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 600; flex-shrink: 0; }
.badge { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 12px; }
.section-label { font-size: 12px; font-weight: 600; color: #888; margin-bottom: 8px; margin-top: 16px; }

/* ── 요약 박스 ── */
.summary-box { border-radius: 12px; padding: 16px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }

/* ── 폼 ── */
.form-label { font-size: 12px; color: #888; margin-bottom: 6px; }
.form-input { width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid #eee; font-size: 14px; outline: none; font-family: inherit; }
textarea.form-input { resize: none; height: 72px; font-size: 13px; }
.grade-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.grade-chip { padding: 6px 12px; border-radius: 20px; border: 1.5px solid #eee; background: #fff; font-size: 12px; color: #555; }

/* ── 날짜 피커 ── */
.date-picker-box { background: #fff; border-radius: 12px; border: 1px solid #eee; padding: 16px; margin-bottom: 12px; max-height: 260px; overflow-y: auto; }
.sunday-chip { padding: 6px 12px; border-radius: 20px; border: 1.5px solid #eee; background: #fafafa; font-size: 13px; color: #555; margin: 3px; }

/* ── 출석 아이템 ── */
.attend-btn { display: flex; align-items: center; justify-content: space-between; width: 100%; padding: 12px 16px; border-radius: 10px; border: 1.5px solid #eee; background: #fff; text-align: left; margin-bottom: 6px; transition: all 0.15s; }
.attend-btn.present { }
.attend-circle { width: 32px; height: 32px; border-radius: 50%; background: #f0f0f0; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; color: #aaa; flex-shrink: 0; }

/* ── 게시판 ── */
.cat-chip { padding: 5px 12px; border-radius: 20px; border: 1.5px solid #eee; background: #fff; font-size: 12px; color: #888; margin-right: 4px; margin-bottom: 4px; }

/* ── 빈 상태 ── */
.empty-state { text-align: center; padding: 40px 16px; color: #bbb; }
.empty-state .icon { font-size: 36px; margin-bottom: 8px; }
.empty-state p { font-size: 14px; }

/* ── 뒤로가기 ── */
.back-btn { background: none; border: none; font-size: 14px; padding: 0; margin-bottom: 16px; }

/* ── 액션 버튼 ── */
.btn-primary { padding: 10px 20px; border: none; border-radius: 8px; color: #fff; font-size: 13px; font-weight: 600; }
.btn-danger { padding: 10px 16px; background: #fff; border: 1px solid #ffcdd2; border-radius: 8px; font-size: 13px; color: #e57373; }
.btn-write { padding: 5px 14px; border-radius: 20px; color: #fff; border: none; font-size: 12px; font-weight: 600; margin-left: auto; }
.add-btn { padding: 10px 16px; border: none; border-radius: 8px; color: #fff; font-size: 13px; font-weight: 600; white-space: nowrap; }
</style>
</head>
<body>

<div id="app">
  <!-- 로그인 -->
  <div id="login-screen">
    <div style="text-align:center;margin-bottom:32px">
      <div style="font-size:44px;margin-bottom:8px">⛪</div>
      <h1 style="font-size:20px;font-weight:700;color:#1a1a1a">순천침례교회</h1>
      <p style="font-size:14px;color:#888;margin-top:4px">교육부 교사 앱</p>
    </div>
    <div class="login-box">
      <p style="font-size:14px;font-weight:600;color:#333;margin-bottom:14px">선생님을 선택해주세요</p>
      <div id="teacher-list"></div>
    </div>
    <p style="font-size:11px;color:#bbb;margin-top:16px">이름 선택 방식 · 로그인 정보는 저장되지 않아요</p>
  </div>

  <!-- 메인 앱 (숨김) -->
  <div id="main-app" style="display:none;flex-direction:column;flex:1">
    <!-- 헤더 -->
    <div id="header">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div>
          <div style="font-size:11px;opacity:0.75">순천침례교회 교육부</div>
          <div id="header-name" style="font-size:16px;font-weight:700"></div>
        </div>
        <button onclick="logout()" style="background:rgba(255,255,255,0.2);border:none;border-radius:8px;color:#fff;font-size:11px;padding:6px 10px">로그아웃</button>
      </div>
      <div class="dept-tabs">
        <button class="dept-tab active" id="dept-el" onclick="switchDept('elementary')">🌱 유·초등부</button>
        <button class="dept-tab" id="dept-yo" onclick="switchDept('youth')">🔥 청소년부</button>
      </div>
    </div>

    <!-- 기능 탭 -->
    <div id="func-tabs" style="top:88px">
      <button class="func-tab active" id="tab-attendance" onclick="switchTab('attendance')">
        <div class="icon">✅</div><div class="label">출석</div>
      </button>
      <button class="func-tab" id="tab-students" onclick="switchTab('students')">
        <div class="icon">👤</div><div class="label">학생</div>
      </button>
      <button class="func-tab" id="tab-prayer" onclick="switchTab('prayer')">
        <div class="icon">🙏</div><div class="label">기도</div>
      </button>
      <button class="func-tab" id="tab-board" onclick="switchTab('board')">
        <div class="icon">📢</div><div class="label">게시판</div>
      </button>
    </div>

    <!-- 콘텐츠 -->
    <div id="content">
      <div id="panel-attendance" class="tab-panel active"></div>
      <div id="panel-students" class="tab-panel"></div>
      <div id="panel-prayer" class="tab-panel"></div>
      <div id="panel-board" class="tab-panel"></div>
    </div>
  </div>
</div>

<script>
// ══════════════════════════════════════════
// ⚠️ Firebase 설정값을 여기에 붙여넣으세요
// ══════════════════════════════════════════
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  databaseURL: "https://YOUR_PROJECT-default-rtdb.firebaseio.com",
  projectId: "YOUR_PROJECT",
  storageBucket: "YOUR_PROJECT.appspot.com",
  messagingSenderId: "YOUR_SENDER_ID",
  appId: "YOUR_APP_ID"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// ── 전역 상태 ──
let currentUser = null;
let currentDept = "elementary";
let currentTab = "attendance";
let selectedDate = getTodaySunday();
let selectedTeacherId = null;
let teacherListeners = {};

const DEPT = {
  elementary: { name: "유·초등부", emoji: "🌱", color: "#1D9E75", light: "#E1F5EE" },
  youth:      { name: "청소년부",  emoji: "🔥", color: "#534AB7", light: "#EEEDFE" }
};

const GRADES = {
  elementary: ["유치","유년","초등1","초등2","초등3","초등4","초등5","초등6"],
  youth:      ["중1","중2","중3","고1","고2","고3"]
};

const CAT_COLORS = { "공지":"#E24B4A", "일정":"#378ADD", "광고":"#1D9E75", "요청":"#EF9F27" };

// ── 날짜 유틸 ──
function getTodaySunday() {
  const today = new Date();
  const day = today.getDay();
  const diff = today.getDate() - day;
  const sun = new Date(today.setDate(diff));
  return sun.toISOString().slice(0,10);
}

function getSundays2026() {
  const sundays = [];
  const d = new Date("2026-01-04");
  while (d.getFullYear() === 2026) {
    sundays.push(d.toISOString().slice(0,10));
    d.setDate(d.getDate()+7);
  }
  return sundays;
}

function fmtDate(s) {
  const d = new Date(s+"T00:00:00");
  return `${d.getMonth()+1}월 ${d.getDate()}일`;
}

function fmtBirth(s) {
  if (!s) return "-";
  const [,m,d] = s.split("-");
  return `${parseInt(m)}월 ${parseInt(d)}일`;
}

function isThisMonth(s) {
  if (!s) return false;
  return parseInt(s.split("-")[1]) === new Date().getMonth()+1;
}

// ── 색상 적용 ──
function applyDeptColor(dept) {
  const d = DEPT[dept];
  document.getElementById("header").style.background = d.color;
  document.querySelectorAll(".func-tab.active .label").forEach(el => el.style.color = d.color);
  document.querySelectorAll(".func-tab.active").forEach(el => el.style.borderBottomColor = d.color);
  document.getElementById("dept-el").style.color = dept === "elementary" ? d.color : "#fff";
  document.getElementById("dept-yo").style.color = dept === "youth" ? d.color : "#fff";
}

// ══════════════════════════════════════════
// 로그인
// ══════════════════════════════════════════
function toggleAddTeacher() {
  const f = document.getElementById("add-teacher-form");
  f.style.display = f.style.display === "none" || !f.style.display ? "block" : "none";
  if (f.style.display === "block") {
    setTimeout(() => document.getElementById("new-teacher-input").focus(), 100);
  }
}

function addTeacher() {
  const input = document.getElementById("new-teacher-input");
  const name = input.value.trim();
  if (!name) return;
  db.ref("teachers").push({ name }).then(() => {
    input.value = "";
    document.getElementById("add-teacher-form").style.display = "none";
  });
}

function renderTeacherList(teachers) {
  const el = document.getElementById("teacher-list");
  el.innerHTML = "";
  if (!teachers || Object.keys(teachers).length === 0) {
    el.innerHTML = `<p style="text-align:center;color:#bbb;font-size:13px;padding:16px">교사 목록이 없어요</p>`;
    return;
  }
  const grid = document.createElement("div");
  grid.style.cssText = "display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:4px";
  Object.entries(teachers).forEach(([id, t]) => {
    const btn = document.createElement("button");
    btn.style.cssText = "padding:14px 6px;border-radius:10px;border:1.5px solid #eee;background:#fafafa;font-size:14px;font-weight:500;color:#333;text-align:center;transition:all 0.15s";
    btn.textContent = t.name;
    btn.onmouseover = () => { btn.style.borderColor="var(--el-color)"; btn.style.background="var(--el-light)"; btn.style.color="var(--el-color)"; };
    btn.onmouseout  = () => { btn.style.borderColor="#eee"; btn.style.background="#fafafa"; btn.style.color="#333"; };
    btn.onclick = () => { currentUser = { id, name: t.name }; doLogin(); };
    grid.appendChild(btn);
  });
  el.appendChild(grid);
}

// ══════════════════════════════════════════
// 교사 목록 (여기서 직접 수정하세요)
// ══════════════════════════════════════════
const TEACHER_LIST = [
  "박여미", "정요환", "김민지", "탁은선", "장옥주",
  "추미옥", "변미영", "배현진", "신순호", "유경숙",
  "고운석", "주재호", "임지은", "박은희", "주호영"
];

// 교사 목록 렌더링 (Firebase 대신 하드코딩)
(function() {
  const teachers = {};
  TEACHER_LIST.forEach((name, i) => { teachers[`t${i}`] = { name }; });
  renderTeacherList(teachers);
})();

function doLogin() {
  if (!currentUser) return;
  document.getElementById("login-screen").style.display = "none";
  const main = document.getElementById("main-app");
  main.style.display = "flex";
  document.getElementById("header-name").textContent = `안녕하세요, ${currentUser.name} 선생님`;
  switchDept("elementary");
  switchTab("attendance");
}

function logout() {
  currentUser = null;
  selectedTeacherId = null;
  document.getElementById("main-app").style.display = "none";
  document.getElementById("login-screen").style.display = "flex";
  document.getElementById("login-btn").classList.remove("active");
  const teachers2 = {};
  TEACHER_LIST.forEach((name, i) => { teachers2[`t${i}`] = { name }; });
  renderTeacherList(teachers2);
}

// ══════════════════════════════════════════
// 부서 / 탭 전환
// ══════════════════════════════════════════
function switchDept(dept) {
  currentDept = dept;
  document.getElementById("dept-el").classList.toggle("active", dept === "elementary");
  document.getElementById("dept-yo").classList.toggle("active", dept === "youth");
  const d = DEPT[dept];
  document.getElementById("dept-el").style.color = dept === "elementary" ? d.color : "#fff";
  document.getElementById("dept-yo").style.color = dept === "youth" ? d.color : "#fff";
  document.getElementById("header").style.background = d.color;
  document.querySelectorAll(".func-tab.active .label").forEach(el => el.style.color = d.color);
  document.querySelectorAll(".func-tab.active").forEach(el => el.style.borderBottomColor = d.color);
  renderTab(currentTab);
}

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll(".func-tab").forEach(el => el.classList.remove("active"));
  document.querySelectorAll(".tab-panel").forEach(el => el.classList.remove("active"));
  document.getElementById("tab-"+tab).classList.add("active");
  document.getElementById("panel-"+tab).classList.add("active");
  const d = DEPT[currentDept];
  document.getElementById("tab-"+tab).style.borderBottomColor = d.color;
  document.getElementById("tab-"+tab).querySelector(".label").style.color = d.color;
  document.getElementById("tab-"+tab).querySelector(".label").style.fontWeight = "600";
  renderTab(tab);
}

function renderTab(tab) {
  if (tab === "attendance") renderAttendance();
  if (tab === "students")   renderStudents();
  if (tab === "prayer")     renderPrayer();
  if (tab === "board")      renderBoard();
}

// ══════════════════════════════════════════
// 출석 탭
// ══════════════════════════════════════════
let attendanceData = {};
let attendanceListener = null;
let studentsForAttend = {};
let studentsListener = null;
let showDatePicker = false;

function renderAttendance() {
  const d = DEPT[currentDept];
  const panel = document.getElementById("panel-attendance");

  // 학생 + 출석 데이터 리스닝
  if (studentsListener) db.ref(`students/${currentDept}`).off("value", studentsListener);
  if (attendanceListener) db.ref(`attendance/${currentDept}/${selectedDate}`).off("value", attendanceListener);

  studentsListener = db.ref(`students/${currentDept}`).on("value", snap => {
    studentsForAttend = snap.val() || {};
    drawAttendance();
  });
  attendanceListener = db.ref(`attendance/${currentDept}/${selectedDate}`).on("value", snap => {
    attendanceData = snap.val() || {};
    drawAttendance();
  });
}

function drawAttendance() {
  const d = DEPT[currentDept];
  const panel = document.getElementById("panel-attendance");
  const students = Object.entries(studentsForAttend).map(([id,v]) => ({id,...v}))
    .sort((a,b) => (a.grade||"").localeCompare(b.grade||"") || a.name.localeCompare(b.name));

  const presentCount = Object.values(attendanceData).filter(v => v?.present).length;
  const total = students.length;
  const pct = total > 0 ? Math.round(presentCount/total*100) : 0;

  const byGrade = {};
  students.forEach(s => { const g = s.grade||"미정"; if (!byGrade[g]) byGrade[g]=[]; byGrade[g].push(s); });

  const sundays = getSundays2026();
  const byMonth = {};
  sundays.forEach(s => { const m = s.slice(5,7)+"월"; if (!byMonth[m]) byMonth[m]=[]; byMonth[m].push(s); });

  let datePickerHtml = "";
  if (showDatePicker) {
    datePickerHtml = `<div class="date-picker-box">` +
      Object.entries(byMonth).map(([month, dates]) =>
        `<div class="section-label" style="margin-top:0">${month}</div>
         <div>${dates.map(dt =>
           `<button class="sunday-chip" onclick="selectDate('${dt}')"
             style="border-color:${selectedDate===dt ? d.color : '#eee'};
                    background:${selectedDate===dt ? d.light : '#fafafa'};
                    color:${selectedDate===dt ? d.color : '#555'};
                    font-weight:${selectedDate===dt ? '600' : '400'}">
             ${fmtDate(dt)}
           </button>`
         ).join("")}</div>`
      ).join("") + `</div>`;
  }

  const gradeRows = Object.entries(byGrade).map(([grade, list]) =>
    `<div class="section-label">${grade}</div>` +
    list.map(s => {
      const present = !!attendanceData[s.id]?.present;
      const by = attendanceData[s.id]?.checkedBy || "";
      return `<button class="attend-btn ${present ? 'present' : ''}" onclick="toggleAttend('${s.id}')"
        style="border-color:${present ? d.color : '#eee'};background:${present ? d.light : '#fff'}">
        <div style="display:flex;align-items:center;gap:10px">
          <div class="attend-circle" style="background:${present ? d.color : '#f0f0f0'};color:${present ? '#fff' : '#aaa'}">
            ${present ? "✓" : s.name[0]}
          </div>
          <div>
            <div style="font-size:14px;font-weight:500;color:${present ? d.color : '#333'}">${s.name}</div>
            ${present && by ? `<div style="font-size:11px;color:${d.color};opacity:0.8">${by} 확인</div>` : ""}
          </div>
        </div>
        <div style="font-size:12px;font-weight:600;color:${present ? d.color : '#ccc'}">${present ? "출석" : "미출석"}</div>
      </button>`;
    }).join("")
  ).join("");

  panel.innerHTML = `
    <button onclick="toggleDatePicker()"
      style="width:100%;padding:12px 16px;background:#fff;border-radius:12px;border:1.5px solid ${d.color};display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
      <span style="font-size:15px;font-weight:600;color:${d.color}">📅 ${fmtDate(selectedDate)} (일)</span>
      <span style="font-size:12px;color:${d.color}">${showDatePicker ? "▲ 닫기" : "▼ 날짜 변경"}</span>
    </button>
    ${datePickerHtml}
    <div class="summary-box" style="background:${d.light}">
      <div>
        <div style="font-size:12px;color:${d.color};font-weight:600">${fmtDate(selectedDate)} 출석</div>
        <div style="font-size:28px;font-weight:700;color:${d.color}">${presentCount}<span style="font-size:16px;font-weight:400">/${total}</span></div>
      </div>
      <div style="text-align:right">
        <div style="font-size:12px;color:${d.color}">출석률</div>
        <div style="font-size:22px;font-weight:700;color:${d.color}">${pct}%</div>
      </div>
    </div>
    ${total === 0 ? `<div class="empty-state"><div class="icon">👤</div><p>학생 탭에서 먼저 학생을 추가해주세요</p></div>` : gradeRows}
  `;
}

function toggleDatePicker() { showDatePicker = !showDatePicker; drawAttendance(); }
function selectDate(dt) { selectedDate = dt; showDatePicker = false; renderAttendance(); }
function toggleAttend(studentId) {
  const current = attendanceData[studentId];
  const val = current ? null : { present: true, checkedBy: currentUser.name, at: new Date().toISOString() };
  db.ref(`attendance/${currentDept}/${selectedDate}/${studentId}`).set(val);
}

// ══════════════════════════════════════════
// 학생 탭
// ══════════════════════════════════════════
let studentsData = {};
let studentListener = null;
let studentView = "list"; // list | detail | form
let selectedStudent = null;
let studentForm = { name:"", birth:"", grade:"", phone:"", note:"" };
let isEditMode = false;

function renderStudents() {
  if (studentListener) db.ref(`students/${currentDept}`).off("value", studentListener);
  studentListener = db.ref(`students/${currentDept}`).on("value", snap => {
    studentsData = snap.val() || {};
    drawStudents();
  });
}

function drawStudents() {
  const d = DEPT[currentDept];
  const panel = document.getElementById("panel-students");
  const students = Object.entries(studentsData).map(([id,v]) => ({id,...v}))
    .sort((a,b) => (a.grade||"").localeCompare(b.grade||"") || a.name.localeCompare(b.name));

  if (studentView === "detail" && selectedStudent) {
    const s = selectedStudent;
    panel.innerHTML = `
      <button class="back-btn" onclick="setStudentView('list')" style="color:${d.color}">← 목록으로</button>
      <div class="card" style="padding:24px">
        <div style="text-align:center;margin-bottom:20px">
          <div class="avatar" style="width:64px;height:64px;background:${d.light};color:${d.color};font-size:24px;margin:0 auto 12px">${s.name[0]}</div>
          <div style="font-size:20px;font-weight:600">${s.name}</div>
          <div style="font-size:13px;color:#888;margin-top:4px">${s.grade||""}</div>
        </div>
        <div style="border-top:1px solid #f0f0f0;padding-top:16px">
          ${[["생일",fmtBirth(s.birth)],["학년/반",s.grade||"-"],["연락처",s.phone||"-"],["메모",s.note||"-"]].map(([label,val])=>
            `<div style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #f8f8f8">
              <span style="font-size:13px;color:#888">${label}</span>
              <span style="font-size:13px;font-weight:500">${val}</span>
            </div>`
          ).join("")}
        </div>
        <div style="display:flex;gap:8px;margin-top:20px">
          <button class="btn-primary" onclick="openEditForm()" style="flex:1;background:${d.color}">수정</button>
          <button class="btn-danger" onclick="deleteStudent('${s.id}')">삭제</button>
        </div>
      </div>`;
    return;
  }

  if (studentView === "form") {
    const grades = GRADES[currentDept];
    panel.innerHTML = `
      <button class="back-btn" onclick="setStudentView(${isEditMode ? "'detail'" : "'list'"})" style="color:${d.color}">← 취소</button>
      <div style="font-size:16px;font-weight:600;margin-bottom:20px">${isEditMode ? "학생 정보 수정" : "새 학생 추가"}</div>
      <div style="display:flex;flex-direction:column;gap:12px">
        <div>
          <div class="form-label">이름 *</div>
          <input class="form-input" id="sf-name" value="${studentForm.name||""}" placeholder="이름 입력">
        </div>
        <div>
          <div class="form-label">학년/반</div>
          <div class="grade-chips">
            ${grades.map(g => `<button class="grade-chip" onclick="selectGrade('${g}')"
              style="border-color:${studentForm.grade===g ? d.color : '#eee'};background:${studentForm.grade===g ? d.light : '#fff'};color:${studentForm.grade===g ? d.color : '#555'};font-weight:${studentForm.grade===g ? '600' : '400'}">${g}</button>`).join("")}
          </div>
        </div>
        <div>
          <div class="form-label">생일</div>
          <input class="form-input" type="date" id="sf-birth" value="${studentForm.birth||""}">
        </div>
        <div>
          <div class="form-label">연락처 (부모님)</div>
          <input class="form-input" id="sf-phone" value="${studentForm.phone||""}" placeholder="010-0000-0000">
        </div>
        <div>
          <div class="form-label">메모</div>
          <textarea class="form-input" id="sf-note" placeholder="특이사항, 알레르기 등...">${studentForm.note||""}</textarea>
        </div>
        <button onclick="saveStudent()" style="padding:14px;background:${d.color};color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:600">
          ${isEditMode ? "수정 완료" : "추가하기"}
        </button>
      </div>`;
    return;
  }

  // 목록
  const birthdayKids = students.filter(s => isThisMonth(s.birth));
  const birthdayHtml = birthdayKids.length > 0 ? `
    <div style="background:#FFF8E1;border-radius:12px;padding:14px 16px;margin-bottom:16px;border:1px solid #FFE082">
      <div style="font-size:12px;font-weight:600;color:#F57F17;margin-bottom:8px">🎂 이달의 생일</div>
      <div style="display:flex;flex-wrap:wrap;gap:8px">
        ${birthdayKids.map(s=>`<span style="font-size:13px;background:#fff;padding:4px 10px;border-radius:20px;border:1px solid #FFE082">${s.name} (${fmtBirth(s.birth)})</span>`).join("")}
      </div>
    </div>` : "";

  const listHtml = students.length === 0
    ? `<div class="empty-state"><div class="icon">👤</div><p>+ 추가 버튼으로 학생을 등록하세요</p></div>`
    : students.map(s => `
      <button class="row-btn" onclick="openStudent('${s.id}')">
        <div class="avatar" style="background:${d.light};color:${d.color}">${s.name[0]}</div>
        <div style="flex:1">
          <div style="font-size:14px;font-weight:500">${s.name} ${isThisMonth(s.birth)?"🎂":""}</div>
          <div style="font-size:12px;color:#aaa">${s.grade||"학년 미정"} ${s.birth ? "· 생일 "+fmtBirth(s.birth) : ""}</div>
        </div>
        <span style="font-size:14px;color:#ccc">›</span>
      </button>`).join("");

  panel.innerHTML = `
    ${birthdayHtml}
    <div style="display:flex;gap:8px;margin-bottom:12px">
      <input class="form-input" placeholder="이름 또는 학년 검색..." oninput="filterStudents(this.value)" style="flex:1">
      <button class="add-btn" onclick="openAddForm()" style="background:${d.color}">+ 추가</button>
    </div>
    <div id="student-list">${listHtml}</div>`;
}

function filterStudents(q) {
  const d = DEPT[currentDept];
  const students = Object.entries(studentsData).map(([id,v]) => ({id,...v}))
    .filter(s => s.name?.includes(q) || s.grade?.includes(q))
    .sort((a,b) => (a.grade||"").localeCompare(b.grade||"") || a.name.localeCompare(b.name));
  document.getElementById("student-list").innerHTML = students.length === 0
    ? `<div class="empty-state"><p>검색 결과가 없어요</p></div>`
    : students.map(s => `
      <button class="row-btn" onclick="openStudent('${s.id}')">
        <div class="avatar" style="background:${d.light};color:${d.color}">${s.name[0]}</div>
        <div style="flex:1">
          <div style="font-size:14px;font-weight:500">${s.name}</div>
          <div style="font-size:12px;color:#aaa">${s.grade||"학년 미정"}</div>
        </div>
        <span style="font-size:14px;color:#ccc">›</span>
      </button>`).join("");
}

function setStudentView(v) { studentView = v; drawStudents(); }
function openStudent(id) { selectedStudent = { id, ...studentsData[id] }; setStudentView("detail"); }
function openAddForm() { studentForm = { name:"", birth:"", grade:"", phone:"", note:"" }; isEditMode = false; setStudentView("form"); }
function openEditForm() { studentForm = { name: selectedStudent.name||"", birth: selectedStudent.birth||"", grade: selectedStudent.grade||"", phone: selectedStudent.phone||"", note: selectedStudent.note||"" }; isEditMode = true; setStudentView("form"); }
function selectGrade(g) { studentForm.grade = g; drawStudents(); }

function saveStudent() {
  const form = {
    name: document.getElementById("sf-name").value.trim(),
    birth: document.getElementById("sf-birth").value,
    grade: studentForm.grade,
    phone: document.getElementById("sf-phone").value.trim(),
    note: document.getElementById("sf-note").value.trim(),
  };
  if (!form.name) return alert("이름을 입력해주세요");
  if (isEditMode) {
    db.ref(`students/${currentDept}/${selectedStudent.id}`).update({ ...form, updatedBy: currentUser.name }).then(() => {
      selectedStudent = { ...selectedStudent, ...form };
      setStudentView("detail");
    });
  } else {
    db.ref(`students/${currentDept}`).push({ ...form, addedBy: currentUser.name, addedAt: new Date().toISOString() }).then(() => setStudentView("list"));
  }
}

function deleteStudent(id) {
  if (!confirm("정말 삭제할까요?")) return;
  db.ref(`students/${currentDept}/${id}`).remove().then(() => setStudentView("list"));
}

// ══════════════════════════════════════════
// 기도 탭
// ══════════════════════════════════════════
let prayerData = {};
let prayerStudents = {};
let selectedPrayerStudent = null;
let newPrayerText = "";

function renderPrayer() {
  db.ref(`students/${currentDept}`).on("value", snap => {
    prayerStudents = snap.val() || {};
    db.ref(`prayers/${currentDept}`).on("value", snap2 => {
      prayerData = snap2.val() || {};
      drawPrayer();
    });
  });
}

function drawPrayer() {
  const d = DEPT[currentDept];
  const panel = document.getElementById("panel-prayer");
  const students = Object.entries(prayerStudents).map(([id,v]) => ({id,...v}))
    .sort((a,b) => (a.grade||"").localeCompare(b.grade||"") || a.name.localeCompare(b.name));

  if (selectedPrayerStudent) {
    const s = selectedPrayerStudent;
    const prayers = prayerData[s.id] ? Object.entries(prayerData[s.id]) : [];
    panel.innerHTML = `
      <button class="back-btn" onclick="selectedPrayerStudent=null;drawPrayer()" style="color:${d.color}">← 기도 제목 목록</button>
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:20px">
        <div class="avatar" style="width:44px;height:44px;background:${d.light};color:${d.color};font-size:18px">${s.name[0]}</div>
        <div>
          <div style="font-size:16px;font-weight:600">${s.name}</div>
          <div style="font-size:12px;color:#888">${s.grade||""} · 기도 제목 ${prayers.length}개</div>
        </div>
      </div>
      <div style="background:${d.light};border-radius:12px;padding:14px;margin-bottom:16px">
        <textarea id="prayer-input" placeholder="기도 제목을 입력하세요..."
          style="width:100%;padding:10px;border-radius:8px;border:1px solid #ddd;font-size:13px;resize:none;height:80px;box-sizing:border-box;outline:none;font-family:inherit"></textarea>
        <button onclick="addPrayer('${s.id}')" style="margin-top:8px;padding:8px 16px;background:${d.color};color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:600">
          기도 제목 추가
        </button>
      </div>
      <div id="prayer-list">
        ${prayers.length === 0
          ? `<div class="empty-state"><p>아직 기도 제목이 없어요 🙏</p></div>`
          : prayers.map(([id,p]) => `
            <div class="card">
              <div style="font-size:14px;color:#333;line-height:1.5;margin-bottom:8px">${p.text}</div>
              <div style="display:flex;justify-content:space-between;align-items:center">
                <span style="font-size:11px;color:#aaa">${p.by} · ${(p.at||"").slice(0,10)}</span>
                ${p.by === currentUser.name ? `<button onclick="deletePrayer('${s.id}','${id}')" style="background:none;border:none;color:#ddd;font-size:12px">삭제</button>` : ""}
              </div>
            </div>`).join("")
        }
      </div>`;
    return;
  }

  panel.innerHTML = `
    <p style="font-size:13px;color:#888;margin-bottom:16px">학생을 선택해 기도 제목을 확인하거나 추가하세요</p>
    ${students.length === 0
      ? `<div class="empty-state"><div class="icon">🙏</div><p>등록된 학생이 없어요</p></div>`
      : students.map(s => {
          const count = prayerData[s.id] ? Object.keys(prayerData[s.id]).length : 0;
          return `<button class="row-btn" onclick="selectedPrayerStudent={id:'${s.id}',...${JSON.stringify(prayerStudents[s.id]||{})}};drawPrayer()">
            <div class="avatar" style="background:${count>0?d.light:'#f5f5f5'};color:${count>0?d.color:'#bbb'}">${s.name[0]}</div>
            <div style="flex:1">
              <div style="font-size:14px;font-weight:500">${s.name}</div>
              <div style="font-size:12px;color:#aaa">${s.grade||""}</div>
            </div>
            ${count>0 ? `<span class="badge" style="background:${d.color};color:#fff">${count}</span>` : ""}
            <span style="font-size:14px;color:#ccc">›</span>
          </button>`;
        }).join("")
    }`;
}

function addPrayer(studentId) {
  const text = document.getElementById("prayer-input").value.trim();
  if (!text) return;
  db.ref(`prayers/${currentDept}/${studentId}`).push({ text, by: currentUser.name, at: new Date().toISOString() });
}

function deletePrayer(studentId, prayerId) {
  db.ref(`prayers/${currentDept}/${studentId}/${prayerId}`).remove();
}

// ══════════════════════════════════════════
// 게시판 탭
// ══════════════════════════════════════════
let boardData = {};
let boardFilter = "전체";
let showBoardForm = false;
let boardForm = { title:"", body:"", category:"공지" };

function renderBoard() {
  db.ref(`board/${currentDept}`).on("value", snap => {
    boardData = snap.val() || {};
    drawBoard();
  });
}

function drawBoard() {
  const d = DEPT[currentDept];
  const panel = document.getElementById("panel-board");
  const posts = Object.entries(boardData).map(([id,v]) => ({id,...v}))
    .sort((a,b) => (b.at||"").localeCompare(a.at||""));
  const filtered = boardFilter === "전체" ? posts : posts.filter(p => p.category === boardFilter);

  const filterHtml = ["전체","공지","일정","광고","요청"].map(c => {
    const cc = CAT_COLORS[c] || d.color;
    const active = boardFilter === c;
    return `<button class="cat-chip" onclick="setBoardFilter('${c}')"
      style="border-color:${active ? cc : '#eee'};background:${active ? cc+'22' : '#fff'};color:${active ? cc : '#888'};font-weight:${active ? '600' : '400'}">${c}</button>`;
  }).join("");

  const formHtml = showBoardForm ? `
    <div class="card" style="margin-bottom:12px">
      <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px">
        ${["공지","일정","광고","요청"].map(c => `
          <button class="cat-chip" onclick="setBoardFormCat('${c}')"
            style="border-color:${boardForm.category===c ? CAT_COLORS[c] : '#ddd'};background:${boardForm.category===c ? CAT_COLORS[c]+'22' : '#fff'};color:${boardForm.category===c ? CAT_COLORS[c] : '#888'};font-weight:${boardForm.category===c ? '600' : '400'}">${c}</button>`).join("")}
      </div>
      <input id="board-title" class="form-input" placeholder="제목" value="${boardForm.title||""}" style="margin-bottom:8px">
      <textarea id="board-body" class="form-input" placeholder="내용 (선택)">${boardForm.body||""}</textarea>
      <div style="display:flex;gap:8px;margin-top:10px">
        <button onclick="submitPost()" style="flex:1;padding:10px;background:${d.color};color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:600">게시</button>
        <button onclick="showBoardForm=false;drawBoard()" style="padding:10px 16px;background:#fff;border:1px solid #eee;border-radius:8px;font-size:13px;color:#888">취소</button>
      </div>
    </div>` : "";

  const postsHtml = filtered.length === 0
    ? `<div class="empty-state"><div class="icon">📢</div><p>게시글이 없어요</p></div>`
    : filtered.map(p => {
        const cc = CAT_COLORS[p.category] || d.color;
        return `<div class="card">
          <div style="display:flex;align-items:center;gap:6px;margin-bottom:6px">
            <span style="font-size:11px;font-weight:600;color:${cc};background:${cc}18;padding:2px 8px;border-radius:10px">${p.category}</span>
            <span style="font-size:13px;font-weight:600">${p.title}</span>
            ${p.by === currentUser.name ? `<button onclick="deletePost('${p.id}')" style="margin-left:auto;background:none;border:none;color:#ddd;font-size:18px">×</button>` : ""}
          </div>
          ${p.body ? `<div style="font-size:13px;color:#555;margin-bottom:8px;line-height:1.5">${p.body}</div>` : ""}
          <div style="font-size:11px;color:#bbb">${p.by} · ${(p.at||"").slice(0,10)}</div>
        </div>`;
      }).join("");

  panel.innerHTML = `
    <div style="display:flex;flex-wrap:wrap;align-items:center;margin-bottom:16px">
      ${filterHtml}
      <button class="btn-write" onclick="showBoardForm=!showBoardForm;drawBoard()" style="background:${d.color}">+ 작성</button>
    </div>
    ${formHtml}
    ${postsHtml}`;
}

function setBoardFilter(f) { boardFilter = f; drawBoard(); }
function setBoardFormCat(c) { boardForm.category = c; drawBoard(); }
function submitPost() {
  const title = document.getElementById("board-title").value.trim();
  const body = document.getElementById("board-body").value.trim();
  if (!title) return;
  db.ref(`board/${currentDept}`).push({ title, body, category: boardForm.category, by: currentUser.name, at: new Date().toISOString() })
    .then(() => { showBoardForm = false; boardForm = { title:"", body:"", category:"공지" }; });
}
function deletePost(id) {
  if (!confirm("삭제할까요?")) return;
  db.ref(`board/${currentDept}/${id}`).remove();
}
</script>
</body>
